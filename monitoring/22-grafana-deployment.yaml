# Grafana.
#
# Storage is an emptyDir on purpose. Everything Grafana needs - the datasource,
# the dashboard provider, the dashboard itself - is provisioned from ConfigMaps
# that live in Git, so there is nothing in its database worth keeping. Losing
# the Pod loses nothing; the replacement comes up identical. Giving it a
# PersistentVolume would create state that Git does not describe, which is the
# opposite of what this assignment is demonstrating.
#
# Anonymous access is enabled with the Viewer role so the dashboard can be read
# and screenshotted without a login. The admin account still exists, and its
# password comes from a Secret created outside Git - it is a credential, and
# the assignment's security rules are clear about those.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: cse644-monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: cse644-assignment-03
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/part-of: cse644-assignment-03
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      volumes:
        - name: storage
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: provisioning
          configMap:
            name: grafana-provisioning
        - name: dashboards
          configMap:
            name: grafana-dashboard-cse644
      containers:
        - name: grafana
          image: docker.io/grafana/grafana:13.1.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-password
            # Read-only access without a login, so the dashboard is
            # screenshottable and reviewable. Editing still requires admin.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_USERS_DEFAULT_THEME
              value: dark
            # A local cluster with no outbound requirement should not be
            # phoning home for version checks or a news feed.
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_NEWS_NEWS_FEED_ENABLED
              value: "false"
          volumeMounts:
            - name: storage
              mountPath: /var/lib/grafana
            # Mounted *inside* the emptyDir above. The kubelet establishes the
            # parent mount first, so the dashboard directory is the ConfigMap
            # and everything else under /var/lib/grafana is scratch space.
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasource.yaml
              subPath: datasource.yaml
              readOnly: true
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
              readOnly: true
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 10
          resources:
            requests:
              cpu: 50m
              memory: 160Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
