apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: cse644-monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: cse644-assignment-03
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
---
# http://grafana.gitops.local:8090/  (Host header routed by the shared
# ingress-nginx controller, same entry point as the applications).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: cse644-monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: cse644-assignment-03
spec:
  ingressClassName: nginx
  rules:
    - host: grafana.gitops.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  name: http
